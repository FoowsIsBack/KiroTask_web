<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="/icons/KiroTask.png" type="image/x-icon">
    <title>KiroTask</title>
</head>
<body>

    <div class="menu">
        <div class="container">
            <div class="nav_left">
                <img id="dialog_photo" src="/icons/KiroTask.png" alt="logo">
                <p>KiroTask</p>
            </div>

            <div class="dev_name">
                <dialog id="myDialog">
                    <form method="dialog">
                        <div class="dialog_logo">
                            <img src="/icons/KiroTask.png" alt="logo">
                        </div>
                        <h2>KiroTask</h2>                        
                        <p class="version_app">Version 1.0.0</p>
                        <hr>   
                        <p><b>Developer:</b> <span class="name">Dave Bangcoyo</span></p>
                        <p><b>Facebook:</b> <a href="https://www.facebook.com/jhinbangcoyo" target="_blank" rel="noopener noreferrer">Visit Profile</a></p>
                        <hr>
                        <div class="closer">
                            <button type="submit" class="download">Close</button>
                        </div>                        
                    </form>                    
                </dialog>
            </div>

            <div class="nav_right">
                <a href="#">Features</a>
                <a href="#">About</a>
                <button class="download">Download</button>
            </div>
        </div>


        <div class="container1">
            <div class="mid_left">
                <h1>Organize Your Life <br>with<span class="bot_text"> KiroTask</span></h1>
                <p>The simple yet powerful task manager that helps you stay on top of <br>everything. Plan, track, and accomplish your goals effortlessly.</p>
                <button class="download1">Download Now</button>
            </div>
            <div class="mid_right">
                <img src="/image/1.png" class="UI">
            </div>
        </div>

        <div class="container2">
            
        </div>

    </div>




    <script src="script.js"></script>
</body>
</html>
